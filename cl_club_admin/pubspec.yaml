name: cl_club_admin
description: Admin-only club screens — the website inquiries inbox and, for super-admins, the website media slots and the club details.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  cl_remote_store:
    path: ../cl_remote_store
  cl_server_config:
    path: ../cl_server_config
  club_sdk_2:
    git:
      url: https://github.com/cloudonlanapps/club_sdk.git
      ref: bbe579d8ac4dca1dcec8a0f8f595ea0b07517b17
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  shadcn_ui: 0.56.1
  ui_lib:
    path: ../ui_lib

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

