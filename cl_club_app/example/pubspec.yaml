name: cl_club_app_example
description: A neutral club app over club_core. Hosts the UI integration suite, run once per server conf.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  cl_club_admin:
    path: ../../cl_club_admin
  cl_club_app:
    path: ..
  cl_club_branding:
    path: ../../cl_club_branding
  cl_club_communication:
    path: ../../cl_club_communication
  cl_club_credits:
    path: ../../cl_club_credits
  cl_club_events:
    path: ../../cl_club_events
  cl_club_members:
    path: ../../cl_club_members
  cl_club_venues:
    path: ../../cl_club_venues
  cl_member_auth:
    path: ../../cl_member_auth
  cl_member_zone:
    path: ../../cl_member_zone
  cl_remote_store:
    path: ../../cl_remote_store
  cl_server_config:
    path: ../../cl_server_config
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  pointer_interceptor: 0.10.1+2
  shadcn_ui: 0.56.1
  ui_lib:
    path: ../../ui_lib

dev_dependencies:
  # Only integration_test/ imports the SDK; the ref must match club_core's.
  club_sdk_2:
    git:
      url: https://github.com/cloudonlanapps/club_sdk.git
      ref: ba70180edcaa2b01e15518e39ad9cff8e7e0b388
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/club.json
    - assets/images/
    - assets/data/

#dependency_overrides:
#  club_sdk_2:
#    path: ../../../packages/club_sdk
