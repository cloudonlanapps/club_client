name: cl_club_app
description: The club application itself — routing, theme and startup. A club app supplies only its config and assets.
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  cl_club_branding:
    path: ../cl_club_branding
  cl_club_communication:
    path: ../cl_club_communication
  cl_club_events:
    path: ../cl_club_events
  cl_member_auth:
    path: ../cl_member_auth
  cl_member_onboarding:
    path: ../cl_member_onboarding
  cl_member_zone:
    path: ../cl_member_zone
  cl_remote_store:
    path: ../cl_remote_store
  cl_server_config:
    path: ../cl_server_config
  club_sdk_2:
    git:
      url: https://github.com/cloudonlanapps/club_sdk.git
      ref: a6b40de24e8d9ff5a34ee4f1db5256cfa16d6715
  file_picker: 8.3.7
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.0
  media_kit: 1.2.6
  shadcn_ui: 0.56.1
  ui_lib:
    path: ../ui_lib
  url_launcher: 6.3.2
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

