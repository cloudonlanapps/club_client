name: cl_club_applications
description: Printable applications — the Applications menu (members download their form, admins list every template), the admin's template editor with preview and state actions, and the download buttons of the profile and the waiting page.
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  cl_club_forms:
    path: ../cl_club_forms
  cl_remote_store:
    path: ../cl_remote_store
  club_sdk_2:
    git:
      url: https://github.com/cloudonlanapps/club_sdk.git
      ref: 6523257ee80b0a759ace815fc6f0b53e828629c9
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  shadcn_ui: 0.56.1
  ui_lib:
    path: ../ui_lib

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

# Local development against the workspace checkouts. Uncomment to build
# against the working trees; it must stay commented in a commit.
#dependency_overrides:
#  club_sdk_2:
#    path: ../../packages/club_sdk
