name: cl_member_auth
description: Standalone authentication library for club apps. GoRouter-free, callback-driven.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  cl_club_branding:
    path: ../cl_club_branding
  cl_club_forms:
    path: ../cl_club_forms
  cl_remote_store:
    path: ../cl_remote_store
  cl_server_config:
    path: ../cl_server_config
  club_sdk_2:
    git:
      url: https://github.com/cloudonlanapps/club_sdk.git
      ref: 56de33addf594906331fabbd4784111342c62986
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 9.2.4
  http: 1.6.0
  shadcn_ui: 0.56.1
  shared_preferences: 2.5.5
  ui_lib:
    path: ../ui_lib

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

