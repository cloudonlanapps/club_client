name: cl_member_onboarding
description: Onboarding screens (welcome + identity-document submission) for the club app. Consumes cl_member_auth, cl_remote_store, ui_lib; does not depend on cl_member_zone or any feature module.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  cl_club_branding:
    path: ../cl_club_branding
  cl_member_auth:
    path: ../cl_member_auth
  cl_remote_store:
    path: ../cl_remote_store
  club_sdk_2:
    git:
      url: https://github.com/cloudonlanapps/club_sdk.git
      ref: bbe579d8ac4dca1dcec8a0f8f595ea0b07517b17
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  shadcn_ui: 0.56.1
  ui_lib:
    path: ../ui_lib

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

