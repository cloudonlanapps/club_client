<!DOCTYPE html>
<html>
<head>
  <!-- Generated by club_project_generator from club_core's template. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="@@DESCRIPTION@@">

  <!-- Cache control - prevent aggressive caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Browser chrome / status-bar tint: the splash's backgrounds, so the
       splash blends into the browser chrome. -->
  <meta name="theme-color" content="@@BACKGROUND_LIGHT@@" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="@@BACKGROUND_DARK@@" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="@@FULL_NAME@@">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>@@FULL_NAME@@</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Loading splash screen, removed once Flutter renders. -->
  <style>
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: @@BACKGROUND_LIGHT@@;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: @@ACCENT_LIGHT@@;
    }
    @media (prefers-color-scheme: dark) {
      .loading {
        background: @@BACKGROUND_DARK@@;
        color: @@ACCENT_DARK@@;
      }
    }
    .loading img {
      width: 120px;
      height: 120px;
      margin-bottom: 16px;
    }
    .loading-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(128, 128, 128, 0.25);
      border-top-color: @@ACCENT_LIGHT@@;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 24px;
    }
    @media (prefers-color-scheme: dark) {
      .spinner {
        border-top-color: @@ACCENT_DARK@@;
      }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <div class="loading" id="loading">
    <img src="icons/Icon-192.png" alt="@@FULL_NAME@@">
    <div class="loading-name">@@SHORT_NAME@@</div>
    <div class="spinner"></div>
  </div>

  <!-- HLS.js for Safari/iOS video playback compatibility -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove splash when Flutter renders (detect canvas or flt-glass-pane)
    function removeSplash() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s ease-out';
        setTimeout(function() { loading.remove(); }, 300);
      }
    }

    // Method 1: MutationObserver to detect Flutter content
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        observer.disconnect();
        removeSplash();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Method 2: Fallback timeout (10 seconds max)
    setTimeout(removeSplash, 10000);
  </script>
</body>
</html>
